version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
        - env | grep -E '^(DATABASE_URL|PRINT_AGENT_TOKEN|PRINT_QUEUE_ENABLED|DIRECT_PRINT_ENABLED|PRINT_CUTOVER_AT|PRINT_AUTO_WINDOW_MINUTES|PRINT_LEASE_SECONDS|S3_BUCKET|S3_REGION|S3_ACCESS_KEY_ID|S3_SECRET_ACCESS_KEY|S3_ENDPOINT|S3_FORCE_PATH_STYLE)=' >> .env.production
        - npx prisma migrate deploy
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*